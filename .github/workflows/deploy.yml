name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # publish the PDF as a GitHub Release asset (production only)
  pull-requests: write # comment the preview URL on PRs

# One production deploy at a time; one preview deploy per PR branch.
concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.head_ref || 'production' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./website

      - name: Generate pages from JSON data
        run: npm run generate
        working-directory: ./website

      # Production (main): full build including the PDF.
      - name: Build (with PDF)
        if: github.event_name != 'pull_request'
        run: npm run build
        working-directory: ./website

      # Previews (PRs): skip the slow PDF generation.
      - name: Build (no PDF)
        if: github.event_name == 'pull_request'
        run: npm run build:no-pdf
        working-directory: ./website

      # The PDF (~42 MB) exceeds Cloudflare Pages' 25 MiB per-file limit, so it
      # is hosted as a GitHub Release asset and reached via a _redirects rule.
      - name: Publish PDF to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pdf-latest
          name: Formation civique – PDF
          body: Version PDF la plus récente, régénérée à chaque déploiement.
          make_latest: false
          files: website/dist/formation-civique.pdf

      - name: Remove PDF from the Pages upload
        if: github.event_name != 'pull_request'
        run: rm -f website/dist/formation-civique.pdf

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: >-
            pages deploy website/dist
            --project-name=open-formation-civique-preview
            --branch=${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
            --commit-dirty=true

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.deployment-url }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## Preview Deployed Successfully!\n\nYour PR preview is live and ready to view:\n\n**${url}**\n\nThe preview will update automatically with each new commit to this PR.`,
            });
