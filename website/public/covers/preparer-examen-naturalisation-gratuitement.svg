<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
  <defs>
    <radialGradient id="dsc-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.34"/>
      <stop offset="45%" stop-color="#0e7490" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dsc-vignette" cx="0.5" cy="0.5" r="0.72">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>
    <pattern id="dsc-dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="#0a0a0a"/>
  <rect width="1600" height="900" fill="url(#dsc-dots)"/>
  <ellipse cx="475" cy="272" rx="820" ry="560" fill="url(#dsc-glow)"/>
  <rect width="1600" height="900" fill="url(#dsc-vignette)"/>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <g fill="none" stroke="#f5f5f5" stroke-opacity="0.9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- exam sheet -->
    <rect x="470" y="190" width="360" height="500" rx="14" stroke="#e6fbff" stroke-opacity="0.95"/>
    <line x1="470" y1="270" x2="830" y2="270" stroke-opacity="0.35"/>

    <!-- question row 1 -->
    <rect x="510" y="310" width="30" height="30" rx="5" stroke="#67e8f9"/>
    <path d="M517 325l7 7 14-15" stroke="#67e8f9"/>
    <line x1="560" y1="325" x2="770" y2="325" stroke-opacity="0.55"/>

    <!-- question row 2 -->
    <rect x="510" y="380" width="30" height="30" rx="5" stroke-opacity="0.55"/>
    <line x1="560" y1="395" x2="740" y2="395" stroke-opacity="0.4"/>

    <!-- question row 3 -->
    <rect x="510" y="450" width="30" height="30" rx="5" stroke-opacity="0.55"/>
    <line x1="560" y1="465" x2="760" y2="465" stroke-opacity="0.4"/>

    <!-- question row 4 -->
    <rect x="510" y="520" width="30" height="30" rx="5" stroke-opacity="0.55"/>
    <line x1="560" y1="535" x2="730" y2="535" stroke-opacity="0.4"/>

    <!-- score line -->
    <line x1="510" y1="610" x2="790" y2="610" stroke-opacity="0.3"/>

    <!-- book / fiches, right side -->
    <path d="M980 330c-45-28-95-38-150-38v260c55 0 105 10 150 38 45-28 95-38 150-38V292c-55 0-105 10-150 38z" stroke="#67e8f9" stroke-opacity="0.9"/>
    <line x1="980" y1="330" x2="980" y2="590" stroke="#67e8f9" stroke-opacity="0.9"/>

    <!-- arrow linking book to sheet -->
    <path d="M900 440h-40" stroke-opacity="0.6"/>
    <path d="M872 428l-12 12 12 12" stroke-opacity="0.6"/>
  </g>

  <text x="650" y="160" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="24" letter-spacing="3" fill="#e6fbff" fill-opacity="0.85">40 QUESTIONS</text>
  <text x="650" y="660" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="24" letter-spacing="3" fill="#67e8f9" fill-opacity="0.95">32/40 REQUIS</text>
  <text x="1055" y="640" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="22" letter-spacing="3" fill="#e6fbff" fill-opacity="0.85">FICHES + QUIZ</text>
</svg>
  
</svg>
